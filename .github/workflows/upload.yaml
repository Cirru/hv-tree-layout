name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      prefix: ${{ steps.asset-path.outputs.prefix }}
      base-url: ${{ steps.asset-path.outputs.base-url }}
      artifact-name: frontend-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@v6.5.0
      with:
        node-version: 24

    - run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate

    - uses: calcit-lang/setup-calcit@v1.5.0
      with:
        deps-file: deps.cirru
        tools: calcit,caps
        caps-version: "0.1.1"

    - name: Validate Calcit project
      run: |
        set -euo pipefail
        yarn install --immutable
        caps --strict --ci
        caps verify --toolchain
        test ! -e compact.cirru
        test ! -e package.cirru
        calcit edit format
        if ! git diff --quiet --exit-code -- calcit.cirru; then
          echo '::error::calcit.cirru is not canonical; run the pinned Calcit edit format and commit its reviewed result.'
          exit 1
        fi
        calcit calcit.cirru --check-only --all-defs
        strict_exit=0
        strict_report="$(calcit fix --workflow strict --verify --format json)" || strict_exit=$?
        printf '%s\n' "$strict_report"
        test "$strict_exit" -eq 0
        jq -e '.data.workflow.status? == "passed" and .diagnostics? == []' <<< "$strict_report"
        calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru
        calcit calcit.cirru --check-only --ns app.main --ns app.comp.container --ns app.comp.expr --ns app.updater --ns app.config --ns app.schema --summary-only
        calcit calcit.cirru test --require-match
        calcit calcit.cirru js

    - name: Select frontend CDN path
      id: asset-path
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        prefix="${GITHUB_REPOSITORY}/"
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
        fi
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "base-url=https://cos-sh.tiye.me/$prefix" >> "$GITHUB_OUTPUT"
        echo "VITE_BASE_URL=https://cos-sh.tiye.me/$prefix" >> "$GITHUB_ENV"

    - name: Build frontend
      run: yarn vite build

    - name: Save tested frontend artifact
      uses: actions/upload-artifact@v7.0.1
      with:
        name: frontend-${{ github.run_id }}-${{ github.run_attempt }}
        path: dist
        if-no-files-found: error
        retention-days: 90

  upload:
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: cos-${{ github.repository }}-${{ github.event.pull_request.number || 'production' }}
      cancel-in-progress: false
      queue: max
    steps:
    - uses: actions/download-artifact@v8.0.1
      with:
        name: ${{ needs.test.outputs.artifact-name }}
        path: dist

    - name: Reject superseded deployment
      id: deploy-head
      env:
        GH_TOKEN: ${{ github.token }}
        DEPLOY_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
        DEPLOY_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      run: |
        set -euo pipefail
        branch_path=$(jq -rn --arg branch "$DEPLOY_BRANCH" '$branch | @uri')
        current_sha=$(gh api "repos/$DEPLOY_REPOSITORY/git/ref/heads/$branch_path" --jq '.object.sha')
        if [[ "$current_sha" == "$EXPECTED_SHA" ]]; then
          echo "current=true" >> "$GITHUB_OUTPUT"
        else
          echo "::notice::Skipping superseded frontend deployment."
        fi

    - name: Check COS credentials
      id: cos-credentials
      if: steps.deploy-head.outputs.current == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
      env:
        COS_BUCKET: ${{ secrets.COS_BUCKET }}
        COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
        COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
      run: |
        if [[ -n "$COS_BUCKET" && -n "$COS_SECRET_ID" && -n "$COS_SECRET_KEY" ]]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          echo "::warning::Configure COS_BUCKET, COS_SECRET_ID and COS_SECRET_KEY to verify uploads."
        else
          echo "::error::All three COS secrets are required for production deployment."
          exit 1
        fi

    - name: Upload and publicly verify frontend assets
      if: steps.deploy-head.outputs.current == 'true' && steps.cos-credentials.outputs.available == 'true'
      uses: worktools/cos-upload-action@v1.2.0
      with:
        source-dir: dist
        bucket: ${{ secrets.COS_BUCKET }}
        region: ap-shanghai
        prefix: ${{ needs.test.outputs.prefix }}
        public-base-url: ${{ needs.test.outputs.base-url }}
        secret-id: ${{ secrets.COS_SECRET_ID }}
        secret-key: ${{ secrets.COS_SECRET_KEY }}

    - name: Deploy to server
      if: steps.deploy-head.outputs.current == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: deploy
      uses: Pendect/action-rsyncer@v2.0.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist/*'
        dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'

    - name: Display status from deploy
      if: steps.deploy-head.outputs.current == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: echo "${{ steps.deploy.outputs.status }}"
